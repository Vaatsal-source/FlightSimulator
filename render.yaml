# Render Blueprint for the FlySim multiplayer server (server/): one shared sky for everyone.
# Render dashboard -> New -> Blueprint -> pick this repository. The game itself
# stays on Vercel. After the first deploy, set VITE_MP_SERVER_URL in Vercel to this
# service's address with wss:// (see README, "Deploying") and redeploy the site.
services:
  - type: web
    name: flysim-rooms
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render's proxy appends the client address to X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # Your site's origin(s), e.g. https://your-project.vercel.app (Render asks for it on first deploy).
      - key: ALLOWED_ORIGINS
        sync: false
